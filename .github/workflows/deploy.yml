name: Deploy to AWS EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-central-1                   # <-- Cambia questa se usi un'altra regione
  EKS_CLUSTER_NAME: swiss-tournament-cluster # <-- Inserisci il nome del tuo cluster EKS

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del codice
      uses: actions/checkout@v4

    - name: 2. Configura le credenziali AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 3. Verifica connessione (Debug)
      run: aws sts get-caller-identity

    - name: 4. Login su Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Da qui in poi ci saranno i passaggi per buildare le immagini
    # e applicare i file Kubernetes (kubectl apply)
    # Li attiviamo non appena confermiamo che il login AWS funziona!
    
    - name: 5. Messaggio di successo
      run: echo "Autenticazione AWS completata con successo!"
