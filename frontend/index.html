<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestore Tornei Svizzera</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
    h1, h2, h3 { color: #333; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #eee; }
    input, button, select { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .match-box { border-bottom: 1px solid #ccc; padding: 10px 0; }
  </style>
</head>
<body>

  <h1>🏆 Gestore Torneo Svizzera</h1>

  <div class="container">
    <!-- Blocco Giocatori -->
    <div class="card">
      <h2>1. Gestione Giocatori (PostgreSQL)</h2>
      <input type="text" id="nome" placeholder="Nome">
      <input type="text" id="cognome" placeholder="Cognome">
      <button onclick="addPlayer()">Aggiungi Giocatore</button>
      
      <h3>Partecipanti Registrati</h3>
      <ul id="players-list"></ul>
    </div>

    <!-- Blocco Torneo -->
    <div class="card">
      <h2>2. Controllo Torneo (MongoDB)</h2>
      <input type="text" id="torneo-nome" placeholder="Nome Torneo" value="Torneo Autunnale">
      <button onclick="createTournament()">Avvia Nuovo Torneo</button>
      <div id="tournament-info" style="margin-top: 10px; font-weight: bold;"></div>

      <button id="btn-next-round" style="display:none; margin-top: 15px;" onclick="generateNextRound()">Genera Prossimo Round</button>

      <h3>Partite del Round</h3>
      <div id="matches-list">Nessun round attivo.</div>
    </div>
  </div>

  <!-- Blocco Classifica -->
  <div class="card" style="margin-top: 20px;">
    <h2>3. Classifica e Tie-Breakers</h2>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Giocatore</th>
          <th>Punti</th>
          <th>OMW%</th>
          <th>O-OMW%</th>
          <th>Somma Quad. Round Persi</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="standings-body">
        <tr><td colspan="7">Nessun dato disponibile</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const PLAYER_API = "http://localhost:3001";
    const TOURNAMENT_API = "http://localhost:5000";
    let currentTournamentId = null;

    // Carica giocatori esistenti
    async function loadPlayers() {
      try {
        const res = await fetch(`${PLAYER_API}/players`);
        const players = await res.json();
        const list = document.getElementById("players-list");
        list.innerHTML = "";
        players.forEach(p => {
          const li = document.createElement("li");
          li.textContent = `[ID: ${p.id}] ${p.cognome} ${p.nome} ${p.ritirato ? '(Ritirato)' : ''}`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error("Errore caricamento giocatori:", err);
      }
    }

    async function addPlayer() {
      const nome = document.getElementById("nome").value;
      const cognome = document.getElementById("cognome").value;
      if (!nome || !cognome) return alert("Inserisci nome e cognome");

      await fetch(`${PLAYER_API}/players`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, cognome })
      });

      document.getElementById("nome").value = "";
      document.getElementById("cognome").value = "";
      loadPlayers();
    }

    async function createTournament() {
      const name = document.getElementById("torneo-nome").value;
      const res = await fetch(`${TOURNAMENT_API}/tournaments`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (res.ok) {
        currentTournamentId = data.tournament_id;
        document.getElementById("tournament-info").innerText = 
          `Torneo ID: ${currentTournamentId} | Round previsti: ${data.total_rounds}`;
        document.getElementById("btn-next-round").style.display = "inline-block";
        updateStandings();
      } else {
        alert(data.error);
      }
    }

    async function generateNextRound() {
      if (!currentTournamentId) return;
      const res = await fetch(`${TOURNAMENT_API}/tournaments/${currentTournamentId}/next-round`, {
        method: "POST"
      });
      const data = await res.json();
      if (res.ok) {
        renderMatches(data.matches);
        updateStandings();
      } else {
        alert(data.error);
      }
    }

    function renderMatches(matches) {
      const container = document.getElementById("matches-list");
      container.innerHTML = "";

      matches.forEach(m => {
        const div = document.createElement("div");
        div.className = "match-box";

        if (m.player2_id === 0) {
          div.innerHTML = `<p><strong>${m.player1_name}</strong> ha il <strong>BYE</strong> (Vittoria automatica)</p>`;
        } else if (m.concluso) {
          div.innerHTML = `<p>${m.player1_name} vs ${m.player2_name} - <em>Concluso (${m.esito})</em></p>`;
        } else {
          div.innerHTML = `
            <p><strong>${m.player1_name}</strong> vs <strong>${m.player2_name}</strong></p>
            <select id="esito-${m.player1_id}-${m.player2_id}">
              <option value="win_p1">Vittoria ${m.player1_name}</option>
              <option value="win_p2">Vittoria ${m.player2_name}</option>
              <option value="double_loss">Doppia Sconfitta</option>
              <option value="drop_p1">Ritiro ${m.player1_name}</option>
              <option value="drop_p2">Ritiro ${m.player2_name}</option>
            </select>
            <button onclick="submitResult(${m.round}, ${m.player1_id}, ${m.player2_id})">Salva Esito</button>
          `;
        }
        container.appendChild(div);
      });
    }

    async function submitResult(round, p1, p2) {
      const select = document.getElementById(`esito-${p1}-${p2}`);
      const esito = select.value;

      const res = await fetch(`${TOURNAMENT_API}/tournaments/${currentTournamentId}/match-result`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ round, player1_id: p1, player2_id: p2, esito })
      });

      if (res.ok) {
        select.disabled = true;
        updateStandings();
        loadPlayers();
      } else {
        const err = await res.json();
        alert(err.error);
      }
    }

    async function updateStandings() {
      if (!currentTournamentId) return;
      const res = await fetch(`${TOURNAMENT_API}/tournaments/${currentTournamentId}/standings`);
      const data = await res.json();
      const tbody = document.getElementById("standings-body");
      tbody.innerHTML = "";

      data.standings.forEach((s, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${s.cognome} ${s.nome}</td>
          <td><strong>${s.points}</strong></td>
          <td>${(s.omw * 100).toFixed(2)}%</td>
          <td>${(s.oomw * 100).toFixed(2)}%</td>
          <td>${s.lost_rounds_sq_sum}</td>
          <td>${s.ritirato ? '<span style="color:red;">Ritirato</span>' : 'In gioco'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadPlayers();
  </script>
</body>
</html>
